[project]
name = "preprocessing"
version = "0.1.0"
description = "uv is the best Python package manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]

[project.scripts]
preprocessing = "preprocessing:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
